[project]
name = "ai-pdf-chat-backend"
version = "1.0.0"
description = "Single-document RAG chat over an uploaded PDF."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `app` and `eval` importable however pytest is invoked (the CI job runs
# the `pytest` script, not `python -m pytest`, so the working directory is not
# on sys.path by default).
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=75"
filterwarnings = [
    "ignore::DeprecationWarning",
]
