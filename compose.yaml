# Topology A: both services on one host, API on the internal network only.
#
# Only the UI is published. The API is reachable only from the compose network,
# so the API key is defence in depth rather than the only control. The whole
# state (index, uploads, registry) lives on named volumes and survives a
# restart AND an image rebuild.
#
# Usage:
#   cp .env.example .env    # then set GOOGLE_API_KEY, DEEPSEEK_API_KEY, API_KEY
#   docker compose up --build
#   open http://127.0.0.1:8501

services:
  api:
    build: ./backend
    env_file: .env
    environment:
      # All three state paths live on the mounted volume, not in the image.
      CHROMA_DIRECTORY: /data/chroma_db
      UPLOAD_DIRECTORY: /data/uploads
      REGISTRY_PATH: /data/registry/registry.sqlite3
      # Explicit, so an inherited platform value cannot trip the guard.
      WEB_CONCURRENCY: "1"
    volumes:
      - chroma:/data/chroma_db
      - uploads:/data/uploads
      - registry:/data/registry
    # Internal only: not published to the host.
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      # The UI is a client of the API, so it needs the same key the API
      # requires. Compose reads API_KEY from .env in this directory.
      BACKEND_API_KEY: ${API_KEY}
      REQUEST_TIMEOUT_SECONDS: "300"
      UPLOAD_TIMEOUT_SECONDS: "1800"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma: {}
  uploads: {}
  registry: {}
